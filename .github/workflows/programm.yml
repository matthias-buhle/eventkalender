name: Programm veröffentlichen

# Veröffentlicht eine neue Programmversion (alles unter site/) mit den bereits vorhandenen Termindaten,
# ohne die Quellen abzufragen. Dauert wenige Minuten statt rund 25. Die Daten selbst holt weiterhin
# "Taeglich aktualisieren". Änderungen an src/ (Quellen-Adaptern) oder sources.json brauchen dagegen einen Datenlauf.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'package.json'
      - '.github/workflows/programm.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Dieselbe Gruppe wie der Datenlauf: beide laufen nie gleichzeitig, das später gestartete wartet.
# Dadurch sieht dieser Lauf immer die Daten des zuletzt fertigen Datenlaufs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_CODE: ${{ vars.SITE_CODE }}
      SITE_CODE_ADMIN: ${{ vars.SITE_CODE_ADMIN }}
      SITE_CODE_PARTNER: ${{ vars.SITE_CODE_PARTNER }}
      SITE_CODE_PARTNER_ENDE: ${{ vars.SITE_CODE_PARTNER_ENDE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Zufallscode prüfen
        run: |
          if [ -z "$SITE_CODE" ]; then
            echo "Die Repository-Variable SITE_CODE fehlt (siehe docs/SETUP.md, Schritt 5)." >&2
            exit 1
          fi

      - run: npm ci

      # Schlägt ein Test fehl, bricht der Lauf hier ab und es wird nichts veröffentlicht.
      - run: npm test

      # Die Termindaten vom zuletzt veröffentlichten Stand holen. Fehlt eine Datei, bricht der Lauf ab:
      # sonst stünde danach eine Seite ohne Termine online (und der nächste Datenlauf ohne Übersetzungs-Zwischenspeicher).
      - name: Vorhandene Daten holen
        run: |
          mkdir -p site/data
          base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/${SITE_CODE}/data"
          for datei in events.json status.json places.json uebersetzungen.json; do
            curl -fsS --retry 3 --retry-delay 5 --max-time 60 "$base/$datei" -o "site/data/$datei" \
              || { echo "Konnte $datei nicht von der veröffentlichten Seite laden, Abbruch." >&2; exit 1; }
          done
          # Die Rohtermine je Quelle gehören dem Datenlauf (Schutz bei Quellenausfall); sie müssen erhalten bleiben,
          # sonst fehlen sie beim nächsten Datenlauf. Gibt es sie noch nicht (vor dem ersten Datenlauf damit), ist das kein Fehler.
          curl -fsS --retry 3 --retry-delay 5 --max-time 60 "$base/rohdaten.json" -o site/data/rohdaten.json \
            || { echo "Hinweis: rohdaten.json gibt es noch nicht, wird übersprungen."; rm -f site/data/rohdaten.json; }
          # Ebenso der Orte-Zwischenspeicher (Nominatim): ginge er verloren, fragte der nächste Datenlauf alles neu.
          curl -fsS --retry 3 --retry-delay 5 --max-time 60 "$base/orte-cache.json" -o site/data/orte-cache.json \
            || { echo "Hinweis: orte-cache.json gibt es noch nicht, wird übersprungen."; rm -f site/data/orte-cache.json; }
          # events.json muss ein JSON mit Terminliste sein, sonst nicht veröffentlichen
          node -e "const d=JSON.parse(require('fs').readFileSync('site/data/events.json','utf8')); if(!Array.isArray(d.events)||!d.events.length||!d.generatedAt){console.error('events.json ist leer oder ungültig');process.exit(1)} console.log(d.events.length+' Termine, Stand '+d.generatedAt)"

      - name: Versionsdatei schreiben
        run: npm run versiondatei

      - name: Seite zusammenstellen
        run: |
          mkdir -p "_pages/${SITE_CODE}"
          cp -r site/. "_pages/${SITE_CODE}/"
          # Optionaler zweiter Zugang mit eigenem Code (z. B. für einen Administrator): gleiche Seite, eigener Ordner.
          # Löschen der Variable SITE_CODE_ADMIN und ein neuer Lauf sperrt ihn wieder.
          if [ -n "$SITE_CODE_ADMIN" ]; then
            if [[ "$SITE_CODE_ADMIN" =~ ^[A-Za-z0-9_-]{8,}$ ]] && [ "$SITE_CODE_ADMIN" != "$SITE_CODE" ]; then
              mkdir -p "_pages/${SITE_CODE_ADMIN}"
              cp -r site/. "_pages/${SITE_CODE_ADMIN}/"
            else
              echo "SITE_CODE_ADMIN ist ungültig (mindestens 8 Zeichen aus A-Z a-z 0-9 _ - und anders als SITE_CODE), der zweite Zugang wird übersprungen." >&2
            fi
          fi
          # Befristeter Zugang für Datenanbieter (eigener Code): gilt, solange das heutige Datum (Berliner Zeit) vor SITE_CODE_PARTNER_ENDE (JJJJ-MM-TT) liegt.
          # Ohne gültiges Enddatum wird er nie veröffentlicht. Vorzeitig sperren: Variable SITE_CODE_PARTNER löschen und einen Lauf anstoßen.
          if [ -n "$SITE_CODE_PARTNER" ]; then
            if ! [[ "$SITE_CODE_PARTNER" =~ ^[A-Za-z0-9_-]{8,}$ ]] || [ "$SITE_CODE_PARTNER" = "$SITE_CODE" ] || [ "$SITE_CODE_PARTNER" = "$SITE_CODE_ADMIN" ]; then
              echo "SITE_CODE_PARTNER ist ungültig (mindestens 8 Zeichen aus A-Z a-z 0-9 _ - und anders als die anderen Codes), der Partner-Zugang wird übersprungen." >&2
            elif ! [[ "$SITE_CODE_PARTNER_ENDE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "SITE_CODE_PARTNER_ENDE fehlt oder ist ungültig (JJJJ-MM-TT), der Partner-Zugang wird übersprungen." >&2
            elif [[ "$(TZ=Europe/Berlin date +%F)" < "$SITE_CODE_PARTNER_ENDE" ]]; then
              mkdir -p "_pages/${SITE_CODE_PARTNER}"
              cp -r site/. "_pages/${SITE_CODE_PARTNER}/"
            else
              echo "Der Partner-Zugang ist am $SITE_CODE_PARTNER_ENDE abgelaufen und wird nicht mehr veröffentlicht."
            fi
          fi
          printf 'User-agent: *\nDisallow: /\n' > _pages/robots.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
