name: Steinhaus diagnostizieren

# Kurzer Prüflauf (Sekunden): zeigt, was der Adapter für Steinhaus Bautzen auf dem GitHub-Rechner sieht.
# Nichts wird veröffentlicht. Nach der Fehlersuche wieder löschen.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Seite abrufen und auswerten
        env:
          EVENTKALENDER_CONTACT: ${{ vars.EVENTKALENDER_CONTACT }}
        run: |
          cat > diagnose.mjs <<'EOF'
          import * as cheerio from 'cheerio';
          import { createPoliteClient } from './src/http.js';
          import { todayBerlin } from './src/time.js';
          const http = createPoliteClient({ userAgent: `Eventkalender-Ostsachsen/1.0 (privater Kalender; ${process.env.EVENTKALENDER_CONTACT})`, perHostDelayMs: 2000 });
          const url = 'https://www.steinhaus-bautzen.de/termine';
          const { body } = await http.get(url, { as: 'text' });
          const heute = todayBerlin(new Date());
          console.log('heute (Berlin):', heute, '| Seitenlänge:', body.length, '| "scheduling" kommt vor:', (body.match(/"scheduling"/g) ?? []).length);
          const $ = cheerio.load(body);
          const skripte = $('script[type="application/json"]').toArray();
          console.log('JSON-Skripte:', skripte.length);
          function finde(w, pfad = '') {
            const treffer = [];
            if (Array.isArray(w)) {
              if (w.length && w[0]?.scheduling && w[0]?.title && w[0]?.slug) treffer.push({ pfad, liste: w });
              w.forEach((x, i) => treffer.push(...finde(x, `${pfad}[${i}]`)));
            } else if (w && typeof w === 'object') {
              for (const k of Object.keys(w)) treffer.push(...finde(w[k], `${pfad}.${k}`));
            }
            return treffer;
          }
          for (const el of skripte) {
            const t = $(el).text();
            if (!t.includes('"scheduling"')) continue;
            let json;
            try { json = JSON.parse(t); } catch (e) { console.log('Skript', $(el).attr('id'), ': JSON kaputt', e.message); continue; }
            for (const { pfad, liste } of finde(json)) {
              const daten = liste.map((r) => r.scheduling?.config?.startDate).filter(Boolean).sort();
              console.log('Skript', $(el).attr('id'), '| Pfad', pfad, '| Einträge', liste.length, '| frühester Start', daten[0], '| spätester Start', daten.at(-1));
              console.log('  Beispiele:', liste.slice(0, 3).map((r) => `${r.title} @ ${r.scheduling?.config?.startDate}`).join(' || '));
            }
          }
          const m = await import('./src/sources/steinhaus.js');
          const e = await m.fetchEvents({ http, today: heute, config: { url } });
          console.log('Adapter liefert', e.length, 'Termine');
          EOF
          node diagnose.mjs
