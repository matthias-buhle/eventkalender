name: Taeglich aktualisieren

on:
  schedule:
    - cron: '43 2 * * *' # täglich 02:43 UTC (03:43 Uhr MEZ); GitHub verzögert Läufe zu vollen Stunden besonders stark
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_CODE: ${{ vars.SITE_CODE }}
      SITE_CODE_ADMIN: ${{ vars.SITE_CODE_ADMIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Zufallscode prüfen
        run: |
          if [ -z "$SITE_CODE" ]; then
            echo "Die Repository-Variable SITE_CODE fehlt (siehe docs/SETUP.md, Schritt 5)." >&2
            exit 1
          fi

      - run: npm ci

      # Schlägt ein Test fehl, bricht der Lauf hier ab und es wird nichts veröffentlicht.
      - run: npm test

      # Den letzten veröffentlichten Stand holen: daraus kommen "seit wann ohne Daten" und die Erkennung leerer Antworten.
      # Beim allerersten Lauf gibt es ihn noch nicht, das ist in Ordnung.
      - name: Vorherigen Status holen
        run: |
          mkdir -p site/data
          curl -fsS --max-time 30 \
            "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/${SITE_CODE}/data/status.json" \
            -o site/data/status.json || rm -f site/data/status.json

      # Zwischenspeicher der DeepL-Übersetzungen vom letzten Stand holen, damit nichts doppelt übersetzt wird.
      # Fehlt er, wird neu übersetzt (rund 25.000 Zeichen), das ist in Ordnung.
      - name: Übersetzungs-Zwischenspeicher holen
        run: |
          curl -fsS --max-time 30 \
            "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/${SITE_CODE}/data/uebersetzungen.json" \
            -o site/data/uebersetzungen.json || rm -f site/data/uebersetzungen.json

      # Die Rohtermine je Quelle vom letzten Stand holen: fällt eine Quelle aus, bleiben ihre Termine vom letzten guten
      # Abruf stehen (bis 14 Tage). Fehlt die Datei (z. B. beim ersten Lauf), gibt es für diesen Lauf nur keinen Schutz.
      - name: Rohtermine vom letzten Stand holen
        run: |
          curl -fsS --retry 2 --max-time 60 \
            "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/${SITE_CODE}/data/rohdaten.json" \
            -o site/data/rohdaten.json || rm -f site/data/rohdaten.json

      # Fällt nur eine Quelle aus, endet der Lauf trotzdem erfolgreich: der Fehler steht in status.json.
      - run: npm run build
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          EVENTKALENDER_CONTACT: ${{ vars.EVENTKALENDER_CONTACT }}

      - name: Seite zusammenstellen
        run: |
          mkdir -p "_pages/${SITE_CODE}"
          cp -r site/. "_pages/${SITE_CODE}/"
          # Optionaler zweiter Zugang mit eigenem Code (z. B. für einen Administrator): gleiche Seite, eigener Ordner.
          # Löschen der Variable SITE_CODE_ADMIN und ein neuer Lauf sperrt ihn wieder.
          if [ -n "$SITE_CODE_ADMIN" ]; then
            if [[ "$SITE_CODE_ADMIN" =~ ^[A-Za-z0-9_-]{8,}$ ]] && [ "$SITE_CODE_ADMIN" != "$SITE_CODE" ]; then
              mkdir -p "_pages/${SITE_CODE_ADMIN}"
              cp -r site/. "_pages/${SITE_CODE_ADMIN}/"
            else
              echo "SITE_CODE_ADMIN ist ungültig (mindestens 8 Zeichen aus A-Z a-z 0-9 _ - und anders als SITE_CODE), der zweite Zugang wird übersprungen." >&2
            fi
          fi
          printf 'User-agent: *\nDisallow: /\n' > _pages/robots.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
